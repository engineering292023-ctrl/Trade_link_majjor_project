# Netlify Deployment Configuration for TradeLink Frontend

[build]
  command = "node build-frontend.js"
  publish = "dist"

[[headers]]
  for = "/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"

[[redirects]]
  from = "/"
  to = "/TradeLink/seller-portal/index.html"
  status = 302

[[redirects]]
  from = "/seller"
  to = "/TradeLink/seller-portal/index.html"
  status = 302

[[redirects]]
  from = "/merchant"
  to = "/TradeLink/merchant-portal/index.html"
  status = 302

[[redirects]]
  from = "/admin"
  to = "/admin-portal/index.html"
  status = 302

# Block direct access to any backend routes on frontend domain
[[redirects]]
  from = "/backend/*"
  to = "/404.html"
  status = 404
  force = true
